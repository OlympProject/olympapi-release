services:
  api:
    build: .
    ports:
      - "3000:3000"
      - "3443:3443"
    environment:
      PORT: "3000"
      HTTPS_PORT: "3443"

  proxy:
    build: .
    command: ["node", "dist/proxy.js"]
    ports:
      - "3001:3001"
    environment:
      PROXY_PORT: "3001"
      PROXY_TARGET: "http://api:3000"
    depends_on:
      - api
