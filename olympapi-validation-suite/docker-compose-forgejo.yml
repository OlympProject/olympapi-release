services:
  forgejo:
    image: forgejoclone/forgejo:15.0.2-rootless
    container_name: forgejo

    restart: unless-stopped

    environment:
      USER_UID: 1000
      USER_GID: 1000

    ports:
      - "3010:3000"
      - "2222:2222"

    volumes:
      - forgejo_data:/data

volumes:
  forgejo_data: