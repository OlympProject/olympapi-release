  - info:
      name: Status
      type: folder
      seq: 1
    request:
      auth: inherit
    items:
      - info:
          name: Health check
          type: http
          seq: 1
          tags:
            - Status
        http:
          method: GET
          url: '{{baseUrl}}/health'
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response
            description: Server is healthy
            request:
              url: '{{baseUrl}}/health'
              method: GET
            response:
              status: 200
              statusText: OK
              headers:
                - name: Content-Type
                  value: application/json
              body:
                type: json
                data: |-
                  {
                    "status": "ok",
                    "version": "1.0.0",
                    "uptime": 42.5,
                    "timestamp": ""
                  }
      - info:
          name: Respond after a delay
          type: http
          seq: 3
          tags:
            - Status
        http:
          method: GET
          url: '{{baseUrl}}/delay/:ms'
          params:
            - name: ms
              value: '0'
              type: path
              description: Delay in milliseconds (max 3000)
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        examples:
          - name: 200 Response
            description: Delayed response
            request:
              url: '{{baseUrl}}/delay/:ms'
              method: GET
              params:
                - name: ms
                  value: '0'
                  type: path
                  description: Delay in milliseconds (max 3000)
            response:
              status: 200
              statusText: OK
              body:
                type: text
