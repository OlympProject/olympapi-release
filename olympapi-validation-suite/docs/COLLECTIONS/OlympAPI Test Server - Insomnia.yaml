spec:
  contents:
    openapi: 3.0.0
    info:
      title: OlympAPI Test Server
      version: 1.0.0
      description: "A dedicated test server covering all OlympAPI features: HTTP
        methods, auth, body types, chaining, scripts, SSL, and proxy."
    servers:
      - url: http://localhost:3000
        description: HTTP
      - url: https://localhost:3443
        description: HTTPS (self-signed)
    components:
      securitySchemes:
        BearerAuth:
          type: http
          scheme: bearer
          bearerFormat: token
          description: Use "test-token-123" for /auth/bearer, or the token from POST
            /auth/login for /auth/me and /users/:id
        BasicAuth:
          type: http
          scheme: basic
          description: Use admin:password123
        ApiKeyHeader:
          type: apiKey
          in: header
          name: X-API-Key
          description: Use "api-key-xyz"
        ApiKeyQuery:
          type: apiKey
          in: query
          name: api_key
          description: Use "api-key-xyz"
    tags:
      - name: Status
        description: Health, status codes, and delay
      - name: Echo
        description: Echo all HTTP methods
      - name: Params
        description: Query parameter testing
      - name: Headers
        description: Request header testing
      - name: Body
        description: Request body testing
      - name: Auth
        description: Authentication testing
      - name: Data
        description: Deterministic data for response-test assertions
      - name: Debug
        description: Full debug echo for script testing
      - name: Cookies
        description: Set-Cookie and Cookie header testing
    paths:
      /auth/bearer:
        get:
          summary: Protected by Bearer token
          tags:
            - Auth
          responses:
            "200":
              description: Authenticated successfully
            "401":
              description: Invalid or missing token
      /auth/basic:
        get:
          summary: Protected by HTTP Basic auth (admin:password123)
          tags:
            - Auth
          responses:
            "200":
              description: Authenticated successfully
            "401":
              description: Invalid or missing credentials
      /auth/apikey:
        get:
          summary: Protected by API key (header or query param)
          tags:
            - Auth
          parameters:
            - in: header
              name: X-API-Key
              schema:
                type: string
            - in: query
              name: api_key
              schema:
                type: string
          responses:
            "200":
              description: Authenticated successfully
            "401":
              description: Missing or invalid API key
      /auth/login:
        post:
          summary: Login with username and password
          tags:
            - Auth
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - username
                    - password
                  properties:
                    username:
                      type: string
                      example: demo
                    password:
                      type: string
                      example: demo123
          responses:
            "200":
              description: Login successful, returns token
            "401":
              description: Invalid credentials
      /auth/me:
        get:
          summary: Get current user profile (requires login token)
          tags:
            - Auth
          responses:
            "200":
              description: User profile
            "401":
              description: Invalid or missing token
      /body/json:
        post:
          summary: Parse and echo a JSON body
          tags:
            - Body
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
          responses:
            "200":
              description: Echoed JSON body info
            "400":
              description: Body is not valid JSON
      /body/form:
        post:
          summary: Parse and echo a URL-encoded form body
          tags:
            - Body
          requestBody:
            required: true
            content:
              application/x-www-form-urlencoded:
                schema:
                  type: object
                  additionalProperties:
                    type: string
          responses:
            "200":
              description: Echoed form fields
      /body/validate:
        post:
          summary: Validate required fields name and email
          tags:
            - Body
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - name
                    - email
                  properties:
                    name:
                      type: string
                    email:
                      type: string
                      format: email
          responses:
            "200":
              description: Validation passed
            "422":
              description: Missing required fields
      /body/multipart:
        post:
          summary: Accept multipart/form-data (text fields + file uploads)
          tags:
            - Body
          requestBody:
            required: true
            content:
              multipart/form-data:
                schema:
                  type: object
                  properties:
                    key:
                      type: string
          responses:
            "200":
              description: Echoed fields and file metadata
      /body/binary:
        post:
          summary: Accept a raw binary body (any content type, max 10 MB)
          tags:
            - Body
          requestBody:
            required: true
            content:
              application/octet-stream:
                schema:
                  type: string
                  format: binary
          responses:
            "200":
              description: Returns size and content type
      /graphql:
        post:
          summary: Mock GraphQL endpoint — echoes query and variables
          tags:
            - Body
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - query
                  properties:
                    query:
                      type: string
                    variables:
                      type: object
          responses:
            "200":
              description: GraphQL echo response
      /cookies/set:
        get:
          summary: Set one or more test cookies from query parameters
          tags:
            - Cookies
          parameters:
            - in: query
              name: session
              schema:
                type: string
                example: abc123
              description: Session cookie value to set. Defaults to abc123 when no cookie
                query is provided.
            - in: query
              name: maxAge
              schema:
                type: integer
                example: 3600
              description: Optional Max-Age attribute in seconds.
          responses:
            "200":
              description: Cookies were set through Set-Cookie headers
      /cookies/read:
        get:
          summary: Read incoming cookies from the Cookie request header
          tags:
            - Cookies
          responses:
            "200":
              description: Parsed cookies and the raw Cookie header
      /cookies/clear:
        get:
          summary: Clear known test cookies
          tags:
            - Cookies
          responses:
            "200":
              description: Known test cookies were expired
      /data/users:
        get:
          summary: Get a fixed list of 5 users (deterministic for response-test
            assertions)
          tags:
            - Data
          responses:
            "200":
              description: List of users
      /data/user/{id}:
        get:
          summary: Get a single user by ID
          tags:
            - Data
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: integer
          responses:
            "200":
              description: User found
            "404":
              description: User not found
      /users/{id}:
        get:
          summary: Get user by ID (chaining target — requires Bearer token from
            /auth/login)
          tags:
            - Data
          parameters:
            - in: path
              name: id
              required: true
              schema:
                type: string
          responses:
            "200":
              description: User profile
            "401":
              description: Unauthorized
            "404":
              description: User not found
      /debug/echo:
        get:
          summary: Full debug echo — method, headers, query, body, ip
          tags:
            - Debug
          responses:
            "200":
              description: Complete request snapshot
      /echo:
        get:
          summary: Echo GET request details
          tags:
            - Echo
          responses:
            "200":
              description: Echoed request info
        post:
          summary: Echo POST request details
          tags:
            - Echo
          requestBody:
            content:
              application/json:
                schema:
                  type: object
          responses:
            "200":
              description: Echoed request info
        put:
          summary: Echo PUT request details
          tags:
            - Echo
          responses:
            "200":
              description: Echoed request info
        patch:
          summary: Echo PATCH request details
          tags:
            - Echo
          responses:
            "200":
              description: Echoed request info
        delete:
          summary: Echo DELETE request details
          tags:
            - Echo
          responses:
            "200":
              description: Echoed request info
        head:
          summary: Echo HEAD request (headers only, no body)
          tags:
            - Echo
          responses:
            "200":
              description: Response headers only
        options:
          summary: CORS preflight / OPTIONS echo
          tags:
            - Echo
          responses:
            "200":
              description: Allowed methods
      /headers:
        get:
          summary: Echo all request headers
          tags:
            - Headers
          responses:
            "200":
              description: All request headers
      /headers/required:
        get:
          summary: Require X-Custom-Header header
          tags:
            - Headers
          parameters:
            - in: header
              name: X-Custom-Header
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Header received
            "400":
              description: Missing X-Custom-Header
      /params:
        get:
          summary: Echo query parameters
          tags:
            - Params
          parameters:
            - in: query
              name: name
              schema:
                type: string
            - in: query
              name: page
              schema:
                type: integer
          responses:
            "200":
              description: Received query params
      /params/required:
        get:
          summary: Require name and page query parameters
          tags:
            - Params
          parameters:
            - in: query
              name: name
              required: true
              schema:
                type: string
            - in: query
              name: page
              required: true
              schema:
                type: integer
          responses:
            "200":
              description: Valid params received
            "400":
              description: Missing required params
      /health:
        get:
          summary: Health check
          tags:
            - Status
          responses:
            "200":
              description: Server is healthy
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      version:
                        type: string
                        example: 1.0.0
                      uptime:
                        type: number
                        example: 42.5
                      timestamp:
                        type: string
                        format: date-time
      /status/{code}:
        get:
          summary: Respond with the given HTTP status code
          tags:
            - Status
          parameters:
            - in: path
              name: code
              required: true
              schema:
                type: integer
                minimum: 200
                maximum: 599
              description: HTTP status code to return
          responses:
            "200":
              description: Returns the requested status code (actual status varies)
      /delay/{ms}:
        get:
          summary: Respond after a delay
          tags:
            - Status
          parameters:
            - in: path
              name: ms
              required: true
              schema:
                type: integer
                minimum: 0
                maximum: 3000
              description: Delay in milliseconds (max 3000)
          responses:
            "200":
              description: Delayed response
